<style>
:root{
  --paper:#F4F3F2;--surface:#FFFFFF;--ink:#1B1B1D;--muted:#686668;--line:#E1DFDD;--edge:#878483;
  --red:#C1332F;--red-soft:#F8E4E2;--green:#1B6F46;--green-soft:#E1F2E8;
  --btn-bg:#292929;--btn-fg:#FFFFFF;--focus:#2A5BD7;--backdrop:rgba(18,18,19,.5);--cordring:transparent;
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121213;--surface:#1D1D1F;--ink:#F2F1F0;--muted:#A5A3A3;--line:#323234;--edge:#6A6869;
    --red:#F26B63;--red-soft:#3A1E1D;--green:#6BD59A;--green-soft:#1B3A2B;
    --btn-bg:#F2F1F0;--btn-fg:#121213;--focus:#8FB0FF;--backdrop:rgba(0,0,0,.65);--cordring:rgba(255,255,255,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#121213;--surface:#1D1D1F;--ink:#F2F1F0;--muted:#A5A3A3;--line:#323234;--edge:#6A6869;
  --red:#F26B63;--red-soft:#3A1E1D;--green:#6BD59A;--green-soft:#1B3A2B;
  --btn-bg:#F2F1F0;--btn-fg:#121213;--focus:#8FB0FF;--backdrop:rgba(0,0,0,.65);--cordring:rgba(255,255,255,.3);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--body)}
body.lock{overflow:hidden}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:560px;margin:0 auto;padding:18px 18px calc(112px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{display:block;flex:none;width:54px;height:54px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.gym{font:800 26px/1 var(--display);letter-spacing:.5px;overflow-wrap:anywhere}
.tag{margin-top:4px;font-size:13px;font-weight:600;color:var(--red)}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{font:800 40px/1 var(--display);letter-spacing:.3px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month{flex:1;text-align:center;font:800 34px/1 var(--display);letter-spacing:.3px}
.back{margin-top:6px;text-align:center;font-size:14px}
.link{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.notice{margin:14px 0 0;padding:10px 12px;border-radius:8px;background:var(--line);font-size:14px}
.notice.warn{background:var(--red-soft);color:var(--red)}

.headline{font:800 46px/1 var(--display);letter-spacing:.2px;margin:24px 0 8px}
.sub{color:var(--muted);margin:0 0 10px}
.sub.small{font-size:14px;margin:8px 0 0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.hint{font-size:14px;color:var(--muted);margin:18px 0 0}
.note{font-size:14px;color:var(--muted);margin:-4px 0 14px}
.empty{color:var(--muted);padding:18px 0}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

.group{margin-top:28px}
.gh{display:flex;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--ink);font:700 15px/1.2 var(--body)}
.gh .count{color:var(--muted);font-weight:500}

.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.name{display:block;max-width:100%;background:none;border:0;padding:0;text-align:left;font:600 17px/1.25 var(--body);color:var(--ink);overflow-wrap:anywhere}
.name.static{cursor:default}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:6px;font-size:14px;color:var(--muted)}
.meta .late,.extra{color:var(--red);font-weight:600}
.extra{font-size:13px;margin-top:4px}
.acts{display:flex;align-items:center;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--btn-bg);color:var(--btn-fg);font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--edge)}
.btn.icon{width:44px;padding:0}
.btn.small{height:38px;padding:0 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.btn.block{width:100%}

.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--line);color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.late{background:var(--red-soft);color:var(--red)}

.cord{--b:#ddd;--t:#ddd;position:relative;display:inline-block;flex:none;width:44px;height:12px;border-radius:6px;overflow:hidden;vertical-align:middle;
  background-color:var(--b);
  background-image:repeating-linear-gradient(118deg,rgba(0,0,0,0) 0 3px,rgba(0,0,0,.2) 3px 4px);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.28),0 0 0 1px var(--cordring)}
.cord i{position:absolute;top:0;right:0;bottom:0;width:30%;
  background-color:var(--t);
  background-image:repeating-linear-gradient(118deg,rgba(0,0,0,0) 0 3px,rgba(0,0,0,.2) 3px 4px);
  box-shadow:inset 1px 0 0 rgba(0,0,0,.28)}
.cord.lg{width:88px;height:20px;border-radius:10px}
.cord.none{background:none;box-shadow:inset 0 0 0 1.5px var(--edge)}

.field{display:block;margin:0 0 16px}
.field>span{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=search],input[type=email],input[type=password],textarea{width:100%;height:46px;padding:0 12px;border:1.5px solid var(--edge);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px}
textarea{height:auto;padding:10px 12px;resize:vertical;line-height:1.4}
.search{margin:18px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{margin:-8px 0 14px;color:var(--red);font-size:14px;font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1.5px solid var(--edge);border-radius:10px;background:var(--surface);font-size:14px}
.chip[aria-pressed="true"],.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:700}
.sec{margin:6px 0 10px;font-size:13px;font-weight:600;color:var(--muted)}
.histlist{margin:0 0 18px;font-size:14px;color:var(--muted)}
.histlist li{padding:3px 0}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.tile{display:grid;justify-items:center;gap:1px;padding:8px 2px;border:1.5px solid var(--edge);border-radius:8px;background:var(--surface);line-height:1.2}
.tile b{font-size:15px}
.tile .y{font-size:11px;color:var(--muted)}
.tile .s{font-size:11px;font-weight:700}
.tile.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.tile.ok .y{color:var(--green)}
.tile.late{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.tile.late .y{color:var(--red)}
.owed{margin:0 0 12px;color:var(--red);font-weight:600;font-size:14px}

.swgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.sw{display:grid;justify-items:center;gap:6px;padding:10px 2px;border:1.5px solid var(--edge);border-radius:10px;background:var(--surface);font-size:13px}
.dot{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),0 0 0 1px var(--cordring)}
.dot.none{background:transparent;border:2px dashed var(--edge);box-shadow:none}
.preview{display:flex;align-items:center;gap:14px;margin:0 0 18px;font-weight:600}
.lvbox{display:grid;gap:8px}
.stack{display:grid;gap:10px;margin-top:8px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:grid;justify-items:center;gap:3px;min-height:58px;padding:8px 2px 9px;border:0;border-top:3px solid transparent;background:none;color:var(--muted);font-size:12px;font-weight:600}
.tab[aria-current="page"]{color:var(--ink);border-top-color:var(--red)}

.backdrop{position:fixed;inset:0;z-index:30;background:var(--backdrop)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;max-height:92%;margin:0 auto;overflow:auto;padding:18px 18px calc(26px + env(safe-area-inset-bottom,0px));background:var(--surface);border-radius:20px 20px 0 0}
.sheet.enter{animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheethead h2{font:800 32px/1.05 var(--display);overflow-wrap:anywhere}
.sheethead h2:focus{outline:none}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 28px);padding:12px 16px;border-radius:10px;background:var(--btn-bg);color:var(--btn-fg);font-size:14px;font-weight:500;transform:translateX(-50%)}
.toast .link{font-weight:700;white-space:nowrap}

@media (prefers-reduced-motion: reduce){.sheet.enter{animation:none}}
@media (max-width:360px){.headline{font-size:40px}.month{font-size:30px}}

.btn[disabled]{opacity:.5;cursor:default}
.authwrap{max-width:420px;margin:0 auto;padding:28px 18px 40px}
.authhead{display:grid;justify-items:center;text-align:center;gap:6px;margin-bottom:22px}
.logo.big{width:104px;height:104px;margin-bottom:6px}
.authhead .title{font-size:38px}
.center{text-align:center}
.foot{margin-top:28px;text-align:center;font-size:13px;color:var(--muted)}
.notice.aniv{display:flex;gap:10px;align-items:flex-start;background:var(--red-soft);color:var(--ink)}
.notice.aniv svg{flex:none;margin-top:1px;color:var(--red)}
.bday{margin-top:22px}
.gh svg,.gh .cord{align-self:center}
.brow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.brow .d{display:inline-block;min-width:3.4em;margin-right:6px;font-weight:700}
.brow.today{color:var(--red);font-weight:700}
.authwrap .err{margin:-6px 0 10px}
.authwrap .err:empty{display:none}
.authwrap form .btn{margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar" aria-label="Seções"></nav>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script src="config.js"></script>
<script>
(function(){
'use strict';

/* ---------- configuração (vem do config.js) ---------- */
const CFG=window.APP_CONFIG||{};
const SB_URL=String(CFG.SUPABASE_URL||'').replace(/\/+$/,'');
const SB_KEY=String(CFG.SUPABASE_KEY||'').trim();
const IDLE_MIN=CFG.IDLE_MIN===undefined?30:Number(CFG.IDLE_MIN);
const COMPANY=CFG.COMPANY_NAME===undefined?'Aurelion':String(CFG.COMPANY_NAME||'').trim().slice(0,60);

function keyProblem(){
  if(!/^https:\/\//.test(SB_URL)) return 'O endereço do Supabase no arquivo config.js está faltando ou incorreto.';
  if(!SB_KEY||SB_KEY.indexOf('COLE_AQUI')>=0) return 'A chave publicável ainda não foi colada no arquivo config.js.';
  if(/^sb_secret_/.test(SB_KEY)) return 'ATENÇÃO: a chave no config.js é a SECRETA. Apague-a agora, gere uma nova no Supabase e use somente a chave publicável (sb_publishable_).';
  if(SB_KEY.split('.').length===3){
    try{
      const p=JSON.parse(atob(SB_KEY.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      if(p&&p.role==='service_role') return 'ATENÇÃO: a chave no config.js é a SECRETA (service_role). Apague-a agora, gere uma nova no Supabase e use somente a chave publicável.';
    }catch(e){}
  }
  return '';
}

/* ---------- utilidades ---------- */
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function bdayThisYear(s,year){
  const p=s.birth.split('-').map(Number);
  let d=p[2];

function daysToBirthday(s){

}

/* ---------- sessão e comunicação com o Supabase ---------- */
const SESS_KEY='mt-sessao-v2',ACTIVE_KEY='mt-ativo-v2';
let session=null;
function loadSession(){
  try{const r=localStorage.getItem(SESS_KEY);if(r){const s=JSON.parse(r);if(s&&s.access_token&&s.refresh_token&&s.user) return s;}}catch(e){}
  return null;
}
function saveSession(s){
  session=s;
  try{if(s) localStorage.setItem(SESS_KEY,JSON.stringify(s)); else localStorage.removeItem(SESS_KEY);}catch(e){}
}
function sessFromToken(j,user){
  const u=j.user||user||{};
  return {access_token:j.access_token,refresh_token:j.refresh_token,
    expires_at:j.expires_at||(Math.floor(Date.now()/1000)+(Number(j.expires_in)||3600)),
    user:{id:u.id,email:u.email}};
}
function httpErr(status,msg,code){const e=new Error(msg);e.status=status;e.code=code;return e;}

async function authFetch(path,opts,token){
  const headers={apikey:SB_KEY,'Content-Type':'application/json'};
  if(token) headers.Authorization='Bearer '+token;
  const r=await fetch(SB_URL+'/auth/v1/'+path,Object.assign({},opts,{headers:headers}));
  const text=await r.text();
  let j=null;
  if(text){try{j=JSON.parse(text);}catch(e){}}
  if(!r.ok) throw httpErr(r.status,(j&&(j.msg||j.error_description||j.message))||('HTTP '+r.status),j&&(j.error_code||j.error));
  return j;
}
async function signIn(email,password){
  const j=await authFetch('token?grant_type=password',{method:'POST',body:JSON.stringify({email:email,password:password})});
  saveSession(sessFromToken(j));
}
let refreshing=null;
function forceRefresh(){
  if(!session) return Promise.reject(httpErr(401,'Sem sessão'));
  if(!refreshing){
    refreshing=authFetch('token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})})
      .then(j=>{saveSession(sessFromToken(j,session.user));})
      .finally(()=>{refreshing=null;});
  }
  return refreshing;
}
async function ensureFresh(){
  if(!session) throw httpErr(401,'Sem sessão');
  if(session.expires_at-Math.floor(Date.now()/1000)>60) return;
  await forceRefresh();
}
function expireSession(msg){
  saveSession(null);
  state=emptyState();
  ui.sheet=null;renderSheet();
  ui.view='login';ui.authInfo=msg||'Sua sessão expirou. Entre novamente.';
  render();
}
async function rest(method,table,query,body,extra){
  for(let attempt=0;attempt<2;attempt++){
    await ensureFresh();
    const headers=Object.assign({apikey:SB_KEY,Authorization:'Bearer '+session.access_token},extra||{});
    if(body!==undefined) headers['Content-Type']='application/json';
    const r=await fetch(SB_URL+'/rest/v1/'+table+(query?'?'+query:''),{method:method,headers:headers,body:body===undefined?undefined:JSON.stringify(body)});
    if(r.status===401&&attempt===0){
      try{await forceRefresh();continue;}catch(e){expireSession();throw httpErr(401,'Sessão expirada');}
    }
    const text=await r.text();
    let j=null;
    if(text){try{j=JSON.parse(text);}catch(e){}}
    if(!r.ok) throw httpErr(r.status,(j&&(j.message||j.msg))||('HTTP '+r.status),j&&j.code);
    return j;
  }
}
async function fetchAll(table,query){
  const out=[],size=1000;
  for(let from=0;from<200000;from+=size){
    const rows=await rest('GET',table,query+'&limit='+size+'&offset='+from);
    if(!Array.isArray(rows)) break;
    for(let i=0;i<rows.length;i++) out.push(rows[i]);
    if(rows.length<size) break;
  }
  return out;
}

function emptyState(){
  return {academia:null,academiaId:null,levels:[],students:[],settings:{gym:'',fee:100,dueDay:10,pix:'',msg:DEFAULT_MSG}};
}
let state=emptyState();

async function loadAll(){
  const res=await Promise.all([
    fetchAll('academias','select=id,nome,status,valido_ate&order=id.asc'),
    fetchAll('perfis','select=academia_id,papel&order=academia_id.asc'),
    fetchAll('configuracoes','select=*&order=academia_id.asc'),
    fetchAll('niveis','select=id,base,ponta,ordem&order=ordem.asc,id.asc'),
    fetchAll('alunos','select=*&order=nome.asc,id.asc'),
    fetchAll('pagamentos','select=id,aluno_id,mes,valor,pago_em&order=mes.asc,id.asc'),
    fetchAll('historico_graduacao','select=id,aluno_id,nivel_id,data&order=data.asc,id.asc')
  ]);
  const acad=res[0],perf=res[1],cfg=res[2],niv=res[3],alu=res[4],pag=res[5],his=res[6];
  const st=emptyState();
  if(!perf.length||!acad.length){state=st;return 'sem-perfil';}
  st.academia=acad[0];st.academiaId=acad[0].id;
  st.levels=niv.map(n=>({id:n.id,base:has(COLORS,n.base)?n.base:'branca',tip:(n.ponta&&has(COLORS,n.ponta))?n.ponta:null}));
  const byId={};
  st.students=alu.map(a=>{
    const s={id:a.id,name:String(a.nome||''),phone:String(a.telefone||''),birth:validBirth(a.nascimento)?a.nascimento:'',level:a.nivel_id||null,
      start:validDate(a.inicio)?a.inicio:iso(today()),dueDay:Math.round(num(a.dia_vencimento,10,1,28)),
      fee:num(a.mensalidade,100,0,100000),active:a.ativo!==false,payments:{},hist:[]};
    byId[s.id]=s;
    return s;
  });
  pag.forEach(p=>{
    const s=byId[p.aluno_id];
    if(!s||typeof p.mes!=='string') return;
    s.payments[p.mes.slice(0,7)]={d:validDate(p.pago_em)?p.pago_em:p.mes.slice(0,10),a:num(p.valor,s.fee,0,100000)};
  });
  his.forEach(h=>{const s=byId[h.aluno_id];if(s&&validDate(h.data)) s.hist.push({l:h.nivel_id,d:h.data});});
  const c=cfg[0]||{};
  st.settings={gym:c.nome_exibicao||'',fee:num(c.mensalidade_padrao,100,0,100000),dueDay:Math.round(num(c.dia_vencimento_padrao,10,1,28)),
    pix:c.chave_pix||'',msg:c.mensagem_cobranca||DEFAULT_MSG};
  state=st;
  return 'ok';
}
function blockInfo(a){

  if(a.valido_ate&&new Date(a.valido_ate)<=new Date()) return {motivo:a.status==='teste'?'teste':'vencido'};
  return null;
}

function dueDate(s,key){
  const p=key.split('-').map(Number);
  let dt=new Date(p[0],p[1]-1,Math.min(s.dueDay,daysIn(p[0],p[1])));
  if(key===s.start.slice(0,7)){const sd=parseISO(s.start);if(sd>dt)dt=sd;}
  return dt;
}
function statusOf(s,key){
  const p=s.payments[key];
  if(p) return {k:'pago',p:p};
  const due=dueDate(s,key);
  const diff=Math.round((today()-due)/86400000);
  return diff>0?{k:'atrasado',days:diff,due:due}:{k:'aberto',days:-diff,due:due};
}
const inMonth=(s,key)=>s.active&&s.start.slice(0,7)<=key;
function owedList(s){
  const out=[],cur=mkey(today());
  let k=s.start.slice(0,7),g=0;
  while(k<=cur&&g++<700){
    if(!s.payments[k]&&(k<cur||today()>dueDate(s,k))) out.push(k);
    k=addMonths(k,1);
  }
  return out;
}
function phoneDigits(p){
  let d=String(p||'').replace(/\D/g,'');
  if(d.indexOf('00')===0) d=d.slice(2);
  if(d.length===10||d.length===11) d='55'+d;
  return d.length>=12&&d.length<=15?d:'';
}
function buildMsg(s,key){
  const p=key.split('-').map(Number);
  const v=s.payments[key]?s.payments[key].a:s.fee;
  const pix=state.settings.pix?'Chave Pix: '+state.settings.pix+'. ':'';
  const tpl=state.settings.msg||DEFAULT_MSG;
  return tpl
    .replace(/\{nome\}/g,()=>first(s.name))
    .replace(/\{mes\}/g,()=>MONTHS[p[1]-1])
    .replace(/\{valor\}/g,()=>fmtBRL(v))
    .replace(/\{vencimento\}/g,()=>String(dueDate(s,key).getDate()))
    .replace(/\{pix\}/g,()=>pix);
}
function waLink(s,key){
  const ph=phoneDigits(s.phone);
  return ph?'https://wa.me/'+ph+'?text='+enc(buildMsg(s,key)):'';
}

function markActive(force){
  lastAct=Date.now();
  if(force||lastAct-lastWrite>15000){lastWrite=lastAct;try{localStorage.setItem(ACTIVE_KEY,String(lastAct));}catch(e){}}
}
function idleExpired(){
  if(!(IDLE_MIN>0)) return false;
  let last=0;
  try{last=Number(localStorage.getItem(ACTIVE_KEY)||0);}catch(e){}
  return !last||Date.now()-last>IDLE_MIN*60000;
}
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>markActive(false),{passive:true}));
setInterval(()=>{
  if(session&&ui.view==='app'&&IDLE_MIN>0&&Date.now()-lastAct>IDLE_MIN*60000){
    ui.authInfo='Sessão encerrada por inatividade. Entre novamente.';
    logout();
  }
},30000);

/* ---------- mensalidades ---------- */
function viewMensal(){
  const key=ui.month,cur=mkey(today()),mm=Number(key.slice(5,7));
  let h='<main class="wrap">'+topbar(
    '<div class="monthnav"><button class="btn ghost icon" data-act="prev" aria-label="Mês anterior">'+I.left+'</button><h1 class="month">'+esc(cap(monthLabel(key)))+'</h1><button class="btn ghost icon" data-act="next" aria-label="Próximo mês">'+I.right+'</button></div>'
    +(key!==cur?'<p class="back"><button class="link" data-act="thismonth">Voltar para este mês</button></p>':'')
  )+notices();
  if(!state.students.some(s=>s.active)) return h+emptyBlock()+'</main>';

  const items=state.students.filter(s=>inMonth(s,key));
  const unpaid=items.filter(s=>!s.payments[key]),paid=items.filter(s=>s.payments[key]);
  const faltam=unpaid.reduce((a,s)=>a+s.fee,0),recebido=paid.reduce((a,s)=>a+s.payments[key].a,0);
  let headline;
  if(!items.length) headline='Nenhum aluno em '+MONTHS[mm-1];
  else if(!unpaid.length) headline='Tudo recebido em '+MONTHS[mm-1];
  else headline='Faltam '+fmtBRL(faltam);
  h+='<section aria-live="polite"><p class="headline">'+esc(headline)+'</p>';
  if(items.length){
    const pct=Math.round(paid.length/items.length*100);
    h+='<p class="sub">'+paid.length+' de '+items.length+(items.length===1?' aluno pagou':' alunos pagaram')+'</p>'
      +'<div class="bar" role="img" aria-label="'+pct+'% dos alunos pagaram"><i style="width:'+pct+'%"></i></div>'
      +'<p class="sub small">Recebido: '+fmtBRL(recebido)+' de '+fmtBRL(recebido+faltam)+'</p>';
  }
  h+='</section>';
  const late=unpaid.filter(s=>statusOf(s,key).k==='atrasado').sort((a,b)=>statusOf(b,key).days-statusOf(a,key).days||byName(a,b));
  const open=unpaid.filter(s=>statusOf(s,key).k==='aberto').sort((a,b)=>statusOf(a,key).due-statusOf(b,key).due||byName(a,b));
  const done=paid.slice().sort((a,b)=>b.payments[key].d.localeCompare(a.payments[key].d)||byName(a,b));
  if(unpaid.length) h+='<p class="hint">O balão cobra pelo WhatsApp. O botão Recebi registra o pagamento.</p>';
  h+=group('Atrasados',late,key)+group('A vencer',open,key)+group('Pagos',done,key);
  return h+'</main>';
}
function group(title,list,key){
  if(!list.length) return '';
  return '<section class="group"><h2 class="gh">'+title+' <span class="count">'+list.length+'</span></h2><ul>'+list.map(s=>rowMensal(s,key)).join('')+'</ul></section>';
}
function rowMensal(s,key){
  const st=statusOf(s,key),l=levelById(s.level);
  let sub,cls='';
  if(st.k==='pago') sub='Paga em '+fmtDate(st.p.d)+', '+fmtBRL(st.p.a);
  else if(st.k==='atrasado'){sub='Atrasada há '+st.days+(st.days===1?' dia':' dias');cls='late';}
  else sub=st.days===0?'Vence hoje':st.days===1?'Vence amanhã':st.days<=7?'Vence em '+st.days+' dias':'Vence dia '+st.due.getDate();
  let extra='';
  if(st.k!=='pago'){
    const before=owedList(s).filter(k=>k<key).length;
    if(before>0) extra='<p class="extra">Mais '+before+(before===1?' mês':' meses')+' em aberto antes deste</p>';
  }
  const acts=st.k==='pago'
    ?'<button class="btn ghost small" data-act="unpay" data-id="'+s.id+'">Desfazer</button>'
    :waBtn(s,key)+'<button class="btn" data-act="pay" data-id="'+s.id+'" aria-label="Registrar recebimento de '+esc(s.name)+'">Recebi</button>';
  return '<li class="row"><div><button class="name" data-act="open" data-id="'+s.id+'">'+esc(s.name)+'</button><div class="meta">'+cordHTML(l)+'<span class="'+cls+'">'+esc(sub)+'</span></div>'+extra+'</div><div class="acts">'+acts+'</div></li>';
}
function waBtn(s,key){
  const link=waLink(s,key),lab='Cobrar '+esc(s.name)+' pelo WhatsApp';
  if(link) return '<a class="btn ghost icon" href="'+esc(link)+'" target="_blank" rel="noopener noreferrer" aria-label="'+lab+'" title="Cobrar pelo WhatsApp">'+I.chat+'</a>';
  return '<button class="btn ghost icon" data-act="needphone" data-id="'+s.id+'" aria-label="'+lab+'" title="Cobrar pelo WhatsApp">'+I.chat+'</button>';
}

function viewAlunos(){
  let h='<main class="wrap">'+topbar('<div class="titlerow"><h1 class="title">Alunos</h1><button class="btn" data-act="new">Novo aluno</button></div>')+notices();
  if(!state.students.length) return h+emptyBlock()+'</main>';
  h+=birthMonthHTML();
  h+='<label class="field search"><span class="sr">Buscar aluno</span><input id="q" type="search" placeholder="Buscar pelo nome" value="'+esc(ui.q)+'" autocomplete="off"></label>';
  h+='<div class="chips sortbar" role="group" aria-label="Ordenar alunos" style="margin-top:12px"><button type="button" class="chip" data-act="sort" data-v="nome" aria-pressed="'+(ui.sort!=='grad')+'">Ordem alfabética</button><button type="button" class="chip" data-act="sort" data-v="grad" aria-pressed="'+(ui.sort==='grad')+'">Por graduação</button></div>';
  return h+'<div id="alunos-list">'+alunosListHTML()+'</div></main>';

function rowAluno(s,cur){
  let pill;
  if(!inMonth(s,cur)) pill='<span class="pill">Começa em '+fmtMonthYear(s.start)+'</span>';
  else{
    const st=statusOf(s,cur);
    pill=st.k==='pago'?'<span class="pill ok">Pago</span>':st.k==='atrasado'?'<span class="pill late">Atrasado</span>':'<span class="pill">Vence dia '+st.due.getDate()+'</span>';
  }
  const l=levelById(s.level);
  return '<li class="row"><div><button class="name" data-act="open" data-id="'+s.id+'">'+esc(s.name)+'</button><div class="meta">'+cordHTML(l)+'<span>'+esc(levelName(l))+'</span></div></div><div class="acts">'+pill+'</div></li>';
}
function alunosListHTML(){
  const q=norm(ui.q.trim()),cur=mkey(today());
  const all=state.students.filter(s=>norm(s.name).indexOf(q)>=0).sort(byName);
  const act=all.filter(s=>s.active),arch=all.filter(s=>!s.active);
  if(!all.length) return '<p class="empty">Nenhum aluno encontrado.</p>';
  let h='';
  if(act.length){
    if(ui.sort==='grad'){
      const groups=levelsDesc().map(l=>({l:l,list:act.filter(s=>s.level===l.id)}));
      const none=act.filter(s=>!levelById(s.level));
      if(none.length) groups.push({l:null,list:none});
      h+=groups.filter(g=>g.list.length).map(g=>'<section class="group"><h2 class="gh">'+cordHTML(g.l)+'<span>'+esc(levelName(g.l))+'</span><span class="count">'+g.list.length+'</span></h2><ul>'+g.list.map(s=>rowAluno(s,cur)).join('')+'</ul></section>').join('');
    }else h+='<ul>'+act.map(s=>rowAluno(s,cur)).join('')+'</ul>';
  }
  if(arch.length) h+='<section class="group"><h2 class="gh">Arquivados <span class="count">'+arch.length+'</span></h2><ul>'+arch.map(s=>
    '<li class="row"><div><button class="name" data-act="open" data-id="'+s.id+'">'+esc(s.name)+'</button></div><div class="acts"><button class="btn ghost small" data-act="reactivate" data-id="'+s.id+'">Reativar</button></div></li>'
  ).join('')+'</ul></section>';
  return h;
}
function birthMonthHTML(){
  const t=today(),y=t.getFullYear(),m=t.getMonth();
  const list=state.students.filter(s=>s.active&&s.birth).map(s=>({s:s,b:bdayThisYear(s,y)}))
    .filter(x=>x.b.getMonth()===m&&ageOn(x.s,y)>=1).sort((a,b)=>a.b-b.b||byName(a.s,b.s));
  const sem=state.students.filter(s=>s.active&&!s.birth).length;
  let h='';
  if(list.length){
    h+='<section class="bday"><h2 class="gh">Aniversariantes de '+MONTHS[m]+' <span class="count">'+list.length+'</span></h2><ul>'
      +list.map(x=>{
        const hoje=x.b.getTime()===t.getTime();
        return '<li class="brow'+(hoje?' today':'')+'"><span><span class="d">'+pad(x.b.getDate())+'/'+pad(m+1)+'</span>'+esc(x.s.name)+'</span><span>'+(hoje?'hoje, ':'')+ageText(ageOn(x.s,y))+'</span></li>';
      }).join('')+'</ul></section>';
  }
  if(sem>0) h+='<p class="hint">'+sem+(sem===1?' aluno ainda está sem data de nascimento.':' alunos ainda estão sem data de nascimento.')+'</p>';
  return h;
}

/* ---------- folhas (sheets) ---------- */
function openSheet(sh,focusId){
  ui.sheet=sh;ui.sheet.fresh=true;ui.sheet.focus=focusId||null;
  renderSheet();
}
function closeSheet(){
  ui.sheet=null;
  renderSheet();
  render();
  const t=ui.trigger;
  if(t){
    try{
      const el=document.querySelector('[data-act="'+t.act+'"]'+(t.id?'[data-id="'+CSS.escape(t.id)+'"]':''));
      if(el) el.focus();
    }catch(e){}
  }
}
function renderSheet(){
  const old=sheetRoot.querySelector('.sheet');
  const keep=old?old.scrollTop:0;
  const open=!!ui.sheet;
  ['app','tabbar','toast-root'].forEach(id=>{const el=document.getElementById(id);if(el)el.inert=open;});
  document.body.classList.toggle('lock',open);
  if(!open){sheetRoot.innerHTML='';return;}
  const sh=ui.sheet;
  const inner=sh.type==='student'?sheetStudent():sh.type==='aniv'?sheetAniv():sheetLevel();
  sheetRoot.innerHTML='<div class="backdrop" data-act="closesheet"></div><div class="sheet'+(sh.fresh?' enter':'')+'" role="dialog" aria-modal="true" aria-labelledby="sheet-title">'+inner+'</div>';
  const el=sheetRoot.querySelector('.sheet');
  if(!sh.fresh) el.scrollTop=keep;
  sh.fresh=false;
  let target=sh.focus?document.getElementById(sh.focus):null;
  if(!target&&old===null) target=document.getElementById('sheet-title');
  if(target) target.focus();
  sh.focus=null;
}
const sheetHead=title=>'<div class="sheethead"><h2 id="sheet-title" tabindex="-1">'+esc(title)+'</h2><button class="btn ghost icon" data-act="closesheet" aria-label="Fechar">'+I.close+'</button></div>';

function sheetStudent(){
  const sh=ui.sheet,s=sh.s,isNew=sh.isNew,cur=mkey(today());
  let h=sheetHead(isNew?'Novo aluno':s.name);
  h+=field('Nome','<input id="f-name" data-f="name" type="text" maxlength="80" autocomplete="off" value="'+esc(s.name)+'">');
  if(sh.err) h+='<p class="err" role="alert">'+esc(sh.err)+'</p>';
  h+=field('WhatsApp (com DDD)','<input id="f-phone" data-f="phone" type="tel" inputmode="tel" autocomplete="off" placeholder="(11) 91234-5678" value="'+esc(s.phone)+'">');
  h+=field('Data de nascimento (opcional)','<input data-f="birth" type="date" min="1900-01-01" max="'+iso(today())+'" value="'+esc(s.birth)+'">');
  h+='<p class="sec">Graduação</p>';
  if(state.levels.length){
    h+='<div class="chips" role="group" aria-label="Graduação" style="margin-bottom:18px">'+levelsDesc().map(l=>
      '<button type="button" class="chip" data-act="setlevel" data-lv="'+l.id+'" aria-pressed="'+(s.level===l.id)+'">'+cordHTML(l)+'<span>'+esc(levelName(l))+'</span></button>'
    ).join('')+'</div>';
  }else h+='<p class="note">Cadastre as graduações na aba Graduações.</p>';
  if(!isNew&&s.hist.length>1){
    h+='<p class="sec">Histórico de graduação</p><ul class="histlist">'+s.hist.slice().reverse().map(x=>'<li>'+esc(levelName(levelById(x.l)))+', desde '+fmtMonthYear(x.d)+'</li>').join('')+'</ul>';
  }
  h+=field('Começou a treinar em','<input data-f="start" type="date" value="'+esc(s.start)+'">');
  h+='<div class="two">'
    +field('Mensalidade (R$)','<input data-f="fee" type="number" inputmode="decimal" min="0" step="0.01" value="'+esc(s.fee)+'">')
    +field('Vencimento (dia)','<input data-f="dueDay" type="number" inputmode="numeric" min="1" max="28" value="'+esc(s.dueDay)+'">')
    +'</div>';
  if(isNew){
    h+='<div class="stack"><button class="btn block" data-act="addstudent">Adicionar aluno</button><button class="btn ghost block" data-act="closesheet">Cancelar</button></div>';
    return h;
  }
  const owed=owedList(s);
  h+='<p class="sec">Pagamentos</p>';
  if(owed.length) h+='<p class="owed">Em aberto: '+owed.length+(owed.length===1?' mês':' meses')+', '+fmtBRL(owed.length*s.fee)+'.</p>';
  const startK=s.start.slice(0,7),keys=[];
  let k=cur;
  for(let i=0;i<sh.months&&k>=startK;i++){keys.push(k);k=addMonths(k,-1);}
  h+='<div class="tiles">'+keys.map(key=>{
    const p=s.payments[key];
    const late=!p&&(key<cur||today()>dueDate(s,key));
    const cls=p?'ok':late?'late':'';
    const label=p?'pago':late?'devendo':'a vencer';
    const mi=Number(key.slice(5,7))-1;
    return '<button type="button" class="tile '+cls+'" data-act="tilepay" data-k="'+key+'" aria-label="'+MONTHS[mi]+' de '+key.slice(0,4)+': '+label+'. Toque para alterar"><b>'+MON[mi]+'</b><span class="y">'+key.slice(0,4)+'</span><span class="s">'+label+'</span></button>';
  }).join('')+'</div>';
  h+='<p class="note">Toque no mês para marcar ou desmarcar. O pagamento fica com a data de hoje.</p>';
  if(k>=startK) h+='<button class="btn ghost small" data-act="moremonths" style="margin-bottom:18px">Ver meses anteriores</button>';
  h+='<div class="stack">'
    +(s.active?'<button class="btn ghost block" data-act="archive">Arquivar aluno (parou de treinar)</button>':'<button class="btn ghost block" data-act="reactivate" data-id="'+s.id+'">Reativar aluno</button>')
    +'<button class="btn danger block" data-act="removestudent">'+(sh.confirm?'Confirmar: remover para sempre':'Remover aluno')+'</button></div>';
  return h;
}

function bdayLink(s){
  const ph=phoneDigits(s.phone);
  if(!ph) return '';
  const msg='Parabéns, '+first(s.name)+'! Hoje é o seu dia. Desejamos muita saúde, força e evolução nos treinos. Um abraço de toda a equipe '+(state.settings.gym||BRAND.name)+'.';
  return 'https://wa.me/'+ph+'?text='+enc(msg);
}

function maybeShowBirthdays(){
  if(!birthdaysToday().length) return;
  const t=iso(today());
  let seen='';
  try{seen=localStorage.getItem('mt-aniv-visto')||'';}catch(e){}
  if(seen===t) return;
  try{localStorage.setItem('mt-aniv-visto',t);}catch(e){}
  ui.trigger=null;
  openSheet({type:'aniv'});
}

  const sh=ui.sheet,isNew=!sh.id;
  const draft={id:'x',base:sh.base,tip:sh.tip};
  let h=sheetHead(isNew?'Nova graduação':'Editar graduação');
  h+='<div class="preview">'+cordHTML(draft,'lg')+'<span>'+esc(levelName(draft))+'</span></div>';
  h+='<p class="sec">Cor da corda</p><div class="swgrid" role="group" aria-label="Cor da corda">'+COLOR_KEYS.map(c=>
    '<button type="button" class="sw" data-act="setbase" data-c="'+c+'" aria-pressed="'+(sh.base===c)+'"><span class="dot" style="background:'+COLORS[c].hex+'"></span><span>'+c+'</span></button>'
  ).join('')+'</div>';
  h+='<p class="sec">Ponta da corda</p><div class="swgrid" role="group" aria-label="Ponta da corda"><button type="button" class="sw" data-act="settip" data-c="" aria-pressed="'+(!sh.tip)+'"><span class="dot none"></span><span>sem ponta</span></button>'
    +COLOR_KEYS.map(c=>'<button type="button" class="sw" data-act="settip" data-c="'+c+'" aria-pressed="'+(sh.tip===c)+'"><span class="dot" style="background:'+COLORS[c].hex+'"></span><span>'+c+'</span></button>').join('')+'</div>';
  h+='<div class="stack"><button class="btn block" data-act="savelevel">'+(isNew?'Adicionar graduação':'Salvar graduação')+'</button>';
  if(!isNew){
    const i=state.levels.findIndex(l=>l.id===sh.id),n=state.levels.length;
    h+='<p class="note" style="margin:6px 0 0">Posição '+(n-i)+' de '+n+' na lista, da graduação mais alta para a mais baixa.</p>'
      +'<div class="two"><button class="btn ghost" data-act="levelup"'+(i>=n-1?' disabled':'')+'>Subir na lista</button><button class="btn ghost" data-act="leveldown"'+(i<=0?' disabled':'')+'>Descer na lista</button></div>'
      +'<button class="btn danger block" data-act="removelevel">'+(sh.confirm?'Confirmar: remover graduação':'Remover graduação')+'</button>';
  }
  return h+'</div>';
}

/* ---------- ações ---------- */
function openStudent(id,focusId){
  const s=stu(id);
  if(!s) return;
  openSheet({type:'student',s:s,isNew:false,months:12,confirm:false,err:''},focusId);
}
function persistStudentSoon(s){debounce('stu-'+s.id,()=>sync(()=>DB.saveStudent(s)),700);}
function act(a,d){
  switch(a){
    case 'tab': ui.tab=d.tab;ui.confirm=null;window.scrollTo(0,0);render();break;
    case 'prev': ui.month=addMonths(ui.month,-1);render();break;
    case 'next': ui.month=addMonths(ui.month,1);render();break;
    case 'thismonth': ui.month=mkey(today());render();break;
    case 'gorecover': ui.view='recover';ui.authInfo='';render();break;
    case 'golog': ui.view='login';render();break;
    case 'retry': enterApp();break;
    case 'logout': logout();break;
    case 'pay':{
      const s=stu(d.id),k=ui.month;
      if(!s) break;
      const p={d:iso(today()),a:s.fee};
      s.payments[k]=p;render();
      sync(()=>DB.pay(s,k,p));
      toast('Recebido de '+first(s.name)+' ('+fmtBRL(s.fee)+')','Desfazer',()=>{delete s.payments[k];render();sync(()=>DB.unpay(s,k));});
      break;
    }
    case 'unpay':{
      const s=stu(d.id),k=ui.month,p=s&&s.payments[k];
      if(!p) break;
      delete s.payments[k];render();
      sync(()=>DB.unpay(s,k));
      toast('Pagamento de '+first(s.name)+' desfeito','Refazer',()=>{s.payments[k]=p;render();sync(()=>DB.pay(s,k,p));});
      break;
    }
    case 'needphone': toast('Cadastre o WhatsApp de '+first((stu(d.id)||{name:'o aluno'}).name)+' para cobrar.');openStudent(d.id,'f-phone');break;
    case 'open': openStudent(d.id);break;
    case 'aniv': openSheet({type:'aniv'});break;
    case 'sort': ui.sort=d.v==='grad'?'grad':'nome';render();break;
    case 'new': openSheet({type:'student',s:newStudent(),isNew:true,err:''},'f-name');break;
    case 'addstudent':{
      const sh=ui.sheet,s=sh.s;
      if(!s.name.trim()){sh.err='Informe o nome do aluno.';renderSheet();const el=document.getElementById('f-name');if(el)el.focus();break;}
      s.name=s.name.trim();
      if(s.level) s.hist=[{l:s.level,d:s.start}];
      state.students.push(s);
      const n=first(s.name);
      sync(()=>DB.addStudent(s));
      closeSheet();toast(n+' foi adicionado');
      break;
    }
    case 'closesheet': closeSheet();break;
    case 'setlevel':{
      const s=ui.sheet.s;
      if(s.level===d.lv) break;
      s.level=d.lv;
      if(!ui.sheet.isNew){
        const last=s.hist[s.hist.length-1],t=iso(today());
        const replace=!!(last&&last.d===t);
        if(replace) last.l=d.lv; else s.hist.push({l:d.lv,d:t});
        clearTimeout(timers['stu-'+s.id]);delete timers['stu-'+s.id];
        sync(()=>DB.setLevel(s,d.lv,replace,t));
      }
      renderSheet();
      break;
    }
    case 'tilepay':{
      const s=ui.sheet.s,k=d.k;
      if(s.payments[k]){delete s.payments[k];sync(()=>DB.unpay(s,k));}
      else{const p={d:iso(today()),a:s.fee};s.payments[k]=p;sync(()=>DB.pay(s,k,p));}
      renderSheet();
      break;
    }
    case 'moremonths': ui.sheet.months+=12;renderSheet();break;
    case 'archive':{const s=ui.sheet.s,n=first(s.name);s.active=false;sync(()=>DB.saveStudent(s));closeSheet();toast(n+' foi arquivado');break;}
    case 'reactivate':{
      const s=stu(d.id);
      if(!s) break;
      s.active=true;sync(()=>DB.saveStudent(s));
      if(ui.sheet){renderSheet();}
      render();toast(first(s.name)+' voltou para a lista');
      break;
    }
    case 'removestudent':{
      const sh=ui.sheet;
      if(!sh.confirm){sh.confirm=true;renderSheet();break;}
      const s=sh.s;
      state.students=state.students.filter(x=>x!==s);
      sync(()=>DB.removeStudent(s));
      closeSheet();toast('Aluno removido');
      break;
    }
    case 'newlevel': openSheet({type:'level',id:null,base:'branca',tip:null,confirm:false});break;
    case 'editlevel':{
      const l=levelById(d.id);
      if(l) openSheet({type:'level',id:l.id,base:l.base,tip:l.tip,confirm:false});
      break;
    }
    case 'setbase': ui.sheet.base=d.c;renderSheet();break;
    case 'settip': ui.sheet.tip=d.c||null;renderSheet();break;
    case 'savelevel':{
      const sh=ui.sheet;
      if(sh.id){const l=levelById(sh.id);if(l){l.base=sh.base;l.tip=sh.tip;sync(()=>DB.patchLevel(l));}}
      else{const l={id:uuid(),base:sh.base,tip:sh.tip};state.levels.push(l);sync(()=>DB.insertLevel(l,state.levels.length));}
      closeSheet();
      break;
    }
    case 'levelup': case 'leveldown':{
      const L=state.levels,i=L.findIndex(l=>l.id===ui.sheet.id),j=a==='levelup'?i+1:i-1;
      if(i<0||j<0||j>=L.length) break;
      const t=L[i];L[i]=L[j];L[j]=t;
      sync(()=>DB.reorderLevels());renderSheet();
      break;
    }
    case 'removelevel':{
      const sh=ui.sheet,n=state.students.filter(s=>s.level===sh.id).length;
      if(n>0){toast('Há '+n+(n===1?' aluno':' alunos')+' com esta graduação. Mude a graduação deles antes de remover.');break;}
      if(!sh.confirm){sh.confirm=true;renderSheet();break;}
      const l=levelById(sh.id);
      state.levels=state.levels.filter(x=>x.id!==sh.id);
      if(l) sync(()=>DB.removeLevel(l));
      closeSheet();
      break;
    }
    case 'resetmsg': state.settings.msg=DEFAULT_MSG;sync(()=>DB.saveSettings());render();break;
    case 'backup':{
      const out={exportado_em:new Date().toISOString(),graduacoes:state.levels.map(l=>levelName(l)),
        alunos:state.students.map(s=>({nome:s.name,telefone:s.phone,nascimento:s.birth||'',graduacao:levelName(levelById(s.level)),inicio:s.start,vencimento:s.dueDay,mensalidade:s.fee,ativo:s.active,pagamentos:s.payments}))};
      ui.backupText=JSON.stringify(out);render();
      const ta=document.getElementById('backup-box');
      if(ta) ta.select();
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(ui.backupText).then(()=>toast('Cópia gerada e copiada'),()=>toast('Selecione o texto do campo e copie'));
      }else toast('Selecione o texto do campo e copie');
      break;
    }
    case 'changepass':{
      const p1=val('p-new'),p2=val('p-new2'),el=document.getElementById('p-err');
      const bad=passProblem(p1,p2);
      if(bad){if(el)el.textContent=bad;break;}
      if(el) el.textContent='';
      ensureFresh().then(()=>authFetch('user',{method:'PUT',body:JSON.stringify({password:p1})},session.access_token))
        .then(()=>{const a1=document.getElementById('p-new'),a2=document.getElementById('p-new2');if(a1)a1.value='';if(a2)a2.value='';toast('Senha alterada');})
        .catch(()=>{const e2=document.getElementById('p-err');if(e2)e2.textContent='Não foi possível trocar a senha. Saia, entre de novo e tente outra vez.';});
      break;
    }
    case 'toastundo':{const f=toastUndo;toastRoot.innerHTML='';toastUndo=null;if(f)f();break;}
  }
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled) return;
  const a=el.dataset.act;
  if(a==='open'||a==='aniv'||a==='new'||a==='editlevel'||a==='newlevel'||a==='needphone') ui.trigger={act:a,id:el.dataset.id||''};
  act(a,el.dataset);
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='f-login') doLogin();
  else if(id==='f-recover') doRecover();
  else if(id==='f-newpass') doNewPass();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet) closeSheet();});
document.addEventListener('input',e=>{
  const el=e.target,ds=el.dataset||{};
  if(el.id==='q'){
    ui.q=el.value;
    const box=document.getElementById('alunos-list');
    if(box) box.innerHTML=alunosListHTML();
    return;
  }
  if(ds.s){
    const st=state.settings;
    if(ds.s==='gym') st.gym=el.value.slice(0,60);
    else if(ds.s==='pix') st.pix=el.value.slice(0,100);
    else if(ds.s==='msg') st.msg=el.value.slice(0,600);
    else if(ds.s==='fee'&&el.value!=='') st.fee=num(el.value,st.fee,0,100000);
    else if(ds.s==='dueDay'&&el.value!=='') st.dueDay=Math.round(num(el.value,st.dueDay,1,28));
    debounce('settings',()=>sync(()=>DB.saveSettings()),800);
    return;
  }
  if(ds.f&&ui.sheet&&ui.sheet.s){
    const s=ui.sheet.s;
    if(ds.f==='name'){
      s.name=el.value.slice(0,80);
      if(!ui.sheet.isNew&&!s.name.trim()) return;
    }
    else if(ds.f==='phone') s.phone=el.value.slice(0,30);
    else if(ds.f==='birth'){if(el.value&&validBirth(el.value)) s.birth=el.value;}
    else if(ds.f==='start'){if(validDate(el.value)) s.start=el.value;}
    else if(ds.f==='fee'){if(el.value!=='') s.fee=num(el.value,s.fee,0,100000);}
    else if(ds.f==='dueDay'){if(el.value!=='') s.dueDay=Math.round(num(el.value,s.dueDay,1,28));}
    if(!ui.sheet.isNew) persistStudentSoon(s);
  }
});
document.addEventListener('change',e=>{
  const el=e.target,ds=el.dataset||{};
  if(ds.s==='fee'||ds.s==='dueDay'){el.value=state.settings[ds.s];return;}
  if(ds.f&&ui.sheet&&ui.sheet.s){
    const s=ui.sheet.s;
    if(ds.f==='name'){
      if(!ui.sheet.isNew&&!s.name.trim()){el.value='';}
      else{
        s.name=s.name.trim();
        const h=document.getElementById('sheet-title');
        if(h&&!ui.sheet.isNew) h.textContent=s.name;
      }
    }
    if(ds.f==='fee'||ds.f==='dueDay') el.value=s[ds.f];
    if(ds.f==='start') el.value=s.start;
    if(ds.f==='birth'){if(el.value==='') s.birth='';else if(validBirth(el.value)) s.birth=el.value;el.value=s.birth;}
    if(!ui.sheet.isNew) persistStudentSoon(s);
  }
});

/* ---------- inicialização ---------- */
function parseHash(){
  const raw=location.hash.replace(/^#/,'');
  if(!raw||raw.indexOf('=')<0) return null;
  const p=new URLSearchParams(raw),out={};
  if(p.get('access_token')){
    out.token=p.get('access_token');out.refresh=p.get('refresh_token')||'';
    out.type=p.get('type')||'';out.expires_in=Number(p.get('expires_in'))||3600;
  }else if(p.get('error')||p.get('error_code')){
    out.error=p.get('error_code')||p.get('error');
  }else return null;
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  return out;
}
async function boot(){
  const problem=keyProblem();
  if(problem){ui.view='config';ui.configMsg=problem;render();return;}
  const h=parseHash();
  if(h&&h.error){
    ui.view='login';
    ui.authInfo='Este link expirou ou já foi usado. Peça um novo em "Esqueci a senha".';
    render();return;
  }
  if(h&&h.token){
    try{
      const u=await authFetch('user',{method:'GET'},h.token);
      saveSession({access_token:h.token,refresh_token:h.refresh,expires_at:Math.floor(Date.now()/1000)+h.expires_in,user:{id:u.id,email:u.email}});
      markActive(true);
      if(h.type==='recovery'||h.type==='invite'){ui.view='newpass';render();return;}
      await enterApp();return;
    }catch(e){
      ui.view='login';ui.authInfo='Não foi possível validar o link. Peça um novo em "Esqueci a senha".';render();return;
    }
  }
  session=loadSession();
  if(session&&idleExpired()){saveSession(null);ui.authInfo='Sessão encerrada por inatividade. Entre novamente.';}
  if(!session){ui.view='login';render();return;}
  markActive(true);
  try{await ensureFresh();}
  catch(e){
    if(e&&e.status&&e.status<500){saveSession(null);ui.view='login';render();return;}
    ui.view='error';ui.errMsg='Sem conexão com o servidor. Verifique a internet e tente de novo.';render();return;
  }
  await enterApp();
}
render();
boot();
})();
